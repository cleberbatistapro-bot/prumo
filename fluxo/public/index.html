<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prumo — Fluxo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0D1117; --surface:#161B22; --surface-2:#1C2128; --surface-3:#21262D;
    --border:#30363D; --teal:#00E7D1; --teal-dim:rgba(0,231,209,.12); --teal-line:rgba(0,231,209,.35);
    --text:#E6EDF3; --muted:#8B949E; --muted-2:#6E7681;
    --red:#F85149; --red-dim:rgba(248,81,73,.13);
    --amber:#E3B341; --amber-dim:rgba(227,179,65,.13);
    --green:#3FB950; --green-dim:rgba(63,185,80,.13);
    --radius:12px; --mono:'JetBrains Mono',monospace; --ui:'Inter',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--ui);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  [hidden]{display:none!important}

  #login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 80% -10%, rgba(0,231,209,.08), transparent 60%),var(--bg);padding:24px}
  .login-card{width:100%;max-width:400px;background:linear-gradient(180deg,var(--surface),#12171E);border:1px solid var(--border);border-radius:16px;padding:34px 30px;box-shadow:0 24px 60px -20px rgba(0,0,0,.7)}
  .brand{display:flex;align-items:center;gap:11px;margin-bottom:24px}
  .brand-mark{width:32px;height:32px;border-radius:9px;background:var(--teal-dim);border:1px solid var(--teal-line);display:grid;place-items:center}
  .brand-mark svg{width:17px;height:17px}
  .brand-name{font-weight:800;letter-spacing:-.01em}
  .login-title{font-size:19px;font-weight:700;margin-bottom:3px}
  .login-sub{color:var(--muted);font-size:13px;margin-bottom:22px}
  .field{margin-bottom:13px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
  .field input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:11px 12px;font-family:var(--mono);font-size:13px}
  .field input:focus{outline:none;border-color:var(--teal-line);box-shadow:0 0 0 3px var(--teal-dim)}
  .btn-primary{width:100%;margin-top:6px;background:var(--teal);color:#04211E;font-weight:700;padding:12px;border-radius:9px;font-size:14px}
  .btn-primary:hover{filter:brightness(1.08)}
  .btn-primary:disabled{opacity:.6;cursor:default}
  .login-error{color:var(--red);font-size:12.5px;font-family:var(--mono);margin-bottom:12px;display:none}
  .login-error.show{display:block}
  .quick{margin-top:22px;padding-top:18px;border-top:1px solid var(--border)}
  .quick-label{font-size:11px;color:var(--muted-2);margin-bottom:10px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase}
  .quick-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .quick-btn{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:9px 6px;font-size:11px;font-weight:600;color:var(--muted)}
  .quick-btn:hover{border-color:var(--teal-line);color:var(--text)}

  #app{display:none;min-height:100vh;grid-template-columns:230px 1fr}
  #app.show{display:grid}
  @media(max-width:860px){#app.show{grid-template-columns:1fr}}
  .sidebar{background:#0B0F14;border-right:1px solid var(--border);padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
  @media(max-width:860px){.sidebar{display:none}}
  .side-brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
  .side-brand .brand-mark{width:28px;height:28px}.side-brand .brand-name{font-size:15px}
  .nav-label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2);padding:14px 10px 6px}
  .nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--muted);font-size:13px;font-weight:500;position:relative;transition:.15s;width:100%;text-align:left}
  .nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:.85}
  .nav-item:hover:not(.locked){background:var(--surface);color:var(--text)}
  .nav-item.active{background:var(--teal-dim);color:var(--teal)}
  .nav-item.active::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;background:var(--teal);border-radius:0 3px 3px 0}
  .nav-item.locked{opacity:.4;cursor:not-allowed}
  .nav-item .lock{margin-left:auto;width:12px;height:12px}
  .nav-item .tag{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--muted-2);border:1px solid var(--border);padding:1px 6px;border-radius:5px}

  .main{display:flex;flex-direction:column;min-width:0}
  .topbar{display:flex;align-items:center;gap:16px;padding:13px 24px;border-bottom:1px solid var(--border);background:rgba(13,17,23,.85);backdrop-filter:blur(8px);position:sticky;top:0;z-index:10}
  .page-title{font-size:16px;font-weight:700}.page-title small{display:block;font-size:11px;font-weight:500;color:var(--muted);font-family:var(--mono)}
  .top-right{margin-left:auto;display:flex;align-items:center;gap:12px}
  .user-chip{display:flex;align-items:center;gap:9px;padding:5px 10px 5px 6px;border:1px solid var(--border);border-radius:30px}
  .avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--teal),#0a8f81);display:grid;place-items:center;color:#04211E;font-weight:700;font-size:12px;font-family:var(--mono)}
  .u-name{font-size:12.5px;font-weight:600;line-height:1.1}.u-role{font-size:10.5px;color:var(--muted);font-family:var(--mono)}
  .logout-btn{border:1px solid var(--border);border-radius:8px;padding:7px 12px;font-size:12px;font-weight:600;color:var(--muted)}
  .logout-btn:hover{color:var(--red);border-color:rgba(248,81,73,.4)}

  .content{padding:22px 24px 40px}
  .view-head{margin-bottom:18px}
  .view-head h2{font-size:18px;font-weight:800;letter-spacing:-.01em}
  .view-head p{font-size:12px;color:var(--muted);font-family:var(--mono);margin-top:3px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}

  .foundation{display:flex;gap:12px;align-items:flex-start;background:linear-gradient(90deg,var(--teal-dim),transparent);border:1px solid var(--teal-line);border-left:3px solid var(--teal);border-radius:12px;padding:15px 17px;margin-bottom:20px}
  .foundation svg{width:20px;height:20px;color:var(--teal);flex-shrink:0;margin-top:1px}
  .foundation .f-title{font-size:14px;font-weight:700;color:var(--teal);margin-bottom:3px}
  .foundation .f-text{font-size:12.5px;color:var(--muted);line-height:1.55;max-width:74ch}

  .audit-list{padding:6px 18px}
  .audit-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--border);font-size:13px}
  .audit-row:last-child{border-bottom:none}
  .audit-row .a-time{font-family:var(--mono);font-size:11px;color:var(--muted-2);width:130px;flex-shrink:0}
  .audit-row.neg .a-time{color:var(--red)}
  .audit-row .a-txt b{color:var(--text)}
  .audit-row .a-txt .who{color:var(--teal);font-weight:600}
  .audit-row.neg .a-txt .who{color:var(--red)}
  .audit-empty{padding:20px;text-align:center;color:var(--muted-2);font-family:var(--mono);font-size:12px}

  .utable{width:100%;border-collapse:collapse;font-size:13px}
  .utable th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-2);font-weight:500;padding:10px 16px;border-bottom:1px solid var(--border)}
  .utable td{padding:12px 16px;border-bottom:1px solid var(--border)}
  .utable tr:last-child td{border-bottom:none}
  .role-tag{font-family:var(--mono);font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px}
  .role-tag.gerente{background:var(--teal-dim);color:var(--teal)}
  .role-tag.coordenador{background:rgba(227,179,65,.15);color:var(--amber)}
  .role-tag.assistente{background:var(--surface-3);color:var(--muted)}

  .restricted{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:60px 20px;text-align:center}
  .restricted svg{width:32px;height:32px;color:var(--muted-2)}
  .restricted .r-title{font-weight:700;font-size:15px}
  .restricted .r-text{font-size:12.5px;color:var(--muted);max-width:320px;font-family:var(--mono);line-height:1.6}

  .footer-note{text-align:center;color:var(--muted-2);font-size:11px;padding:24px 0 0;font-family:var(--mono)}
  .footer-note span{color:var(--teal)}
</style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <div class="brand"><div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#00E7D1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg></div><div class="brand-name">Prumo</div></div>
    <div class="login-title">Entrar no Fluxo</div>
    <div class="login-sub">Autenticação real · Fase 0 — Espinha</div>
    <div class="login-error" id="loginError"></div>
    <div class="field"><label>E-mail corporativo</label><input id="fEmail" type="text" value="gerente@prumo.demo" spellcheck="false"></div>
    <div class="field"><label>Senha</label><input id="fSenha" type="password" value="Prumo@123"></div>
    <button class="btn-primary" id="btnEntrar">Entrar</button>
    <div class="quick"><div class="quick-label">Demonstração — preencher como</div>
      <div class="quick-row">
        <button class="quick-btn" data-email="ana@prumo.demo">Assistente</button>
        <button class="quick-btn" data-email="carla@prumo.demo">Coordenador</button>
        <button class="quick-btn" data-email="gerente@prumo.demo">Gerente</button>
      </div></div>
  </div>
</div>

<div id="app">
  <aside class="sidebar">
    <div class="side-brand"><div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#00E7D1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg></div><div class="brand-name">Prumo</div></div>
    <div id="nav"></div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div class="page-title" id="pageTitle">Espinha<small>fundação: autenticação, RBAC e auditoria</small></div>
      <div class="top-right">
        <div class="user-chip"><div class="avatar" id="avatar">--</div><div><div class="u-name" id="uName">—</div><div class="u-role" id="uRole">—</div></div></div>
        <button class="logout-btn" id="btnSair">Sair</button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<script>
const NAV = [
  { grp: "Operação" },
  { id: "fluxo", label: "Linha de Produção", icon: "flow", roles: ["assistente","coordenador","gerente"], soon: true },
  { grp: "Administração" },
  { id: "auditoria", label: "Auditoria", icon: "shield", roles: ["gerente"] },
  { id: "usuarios", label: "Usuários & Acessos", icon: "users", roles: ["gerente"] },
];
const ICONS = {
  flow:'<path d="M4 6h6M4 12h16M14 18h6"/><circle cx="14" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="10" cy="18" r="2"/>',
  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/>',
};
const svg=(n)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`;
const lockIcon='<svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';
const TITLES = {
  fluxo: ["Linha de Produção", "próximo bloco — ainda não construído"],
  auditoria: ["Auditoria", "registro imutável de acessos e ações — dados reais do D1"],
  usuarios: ["Usuários & Acessos", "o cargo define o que cada pessoa pode fazer (RBAC no servidor)"],
};
const initials=(name)=>name.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();

let me = null;
let view = "auditoria";

async function api(path, opts){
  const res = await fetch(path, { credentials: "include", headers: {"Content-Type":"application/json"}, ...opts });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || "Erro inesperado.");
  return data;
}

function allowed(id){ const it = NAV.find(n=>n.id===id); return it && me && it.roles.includes(me.role); }

function renderNav(){
  let html = "";
  NAV.forEach(item=>{
    if(item.grp){ html += `<div class="nav-label">${item.grp}</div>`; return; }
    const ok = me && item.roles.includes(me.role);
    let cls = "nav-item"; if(item.id===view && ok) cls += " active"; if(!ok) cls += " locked";
    const right = !ok ? lockIcon : (item.soon ? '<span class="tag">em breve</span>' : "");
    html += `<button class="${cls}" data-id="${item.id}" ${ok?'':'disabled'}>${svg(item.icon)}<span>${item.label}</span>${right}</button>`;
  });
  document.getElementById("nav").innerHTML = html;
}

function restricted(){
  return `<div class="restricted">${lockIcon.replace('class="lock"','style="width:32px;height:32px"')}<div class="r-title">Acesso restrito</div><div class="r-text">Esta área é exclusiva do cargo Gerente. O acesso foi negado no servidor e ficou registrado na auditoria.</div></div>`;
}

async function viewAuditoria(){
  try{
    const { rows } = await api("/api/audit");
    if(!rows.length) return `<div class="card audit-empty">Nenhum evento ainda.</div>`;
    const NEG = new Set(["login_falhou","acesso_negado"]);
    const html = rows.map(r=>{
      const neg = NEG.has(r.action);
      return `<div class="audit-row ${neg?'neg':''}"><span class="a-time">${new Date(r.created_at+"Z").toLocaleString('pt-BR')}</span><span class="a-txt"><span class="who">${r.actor_name}</span> ${r.action.replace(/_/g,' ')}${r.target?` — <b>${r.target}</b>`:''}</span></div>`;
    }).join("");
    return `<div class="card audit-list">${html}</div>`;
  }catch(e){ return restricted(); }
}

async function viewUsuarios(){
  try{
    const { rows } = await api("/api/users");
    const trs = rows.map(u=>`<tr><td>${u.name}</td><td>${u.email}</td><td><span class="role-tag ${u.role}">${u.role}</span></td></tr>`).join("");
    return `<div class="card"><table class="utable"><thead><tr><th>Pessoa</th><th>E-mail</th><th>Cargo</th></tr></thead><tbody>${trs}</tbody></table></div>`;
  }catch(e){ return restricted(); }
}

function viewFluxo(){
  return `<div class="restricted"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><div class="r-title">Próximo bloco</div><div class="r-text">A Linha de Produção entra depois que a Espinha (esta tela) estiver fechada — ver mockup-fluxo-tarefa-v2.html para a referência aprovada.</div></div>`;
}

async function render(){
  if(!me) return;
  document.getElementById("uName").textContent = me.name;
  document.getElementById("uRole").textContent = me.role[0].toUpperCase()+me.role.slice(1);
  document.getElementById("avatar").textContent = initials(me.name);
  if(!allowed(view)) view = allowed("auditoria") ? "auditoria" : "fluxo";
  renderNav();
  const [tt, ts] = TITLES[view];
  document.getElementById("pageTitle").innerHTML = `${tt}<small>${ts}</small>`;
  const [head, body] = [
    `<div class="foundation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg><div><div class="f-title">Fase 0 — Espinha, dados reais</div><div class="f-text">Login, RBAC e auditoria acima já rodam contra um banco D1 de verdade — sem mock. Cada tentativa de acesso (permitida ou negada) vira uma linha nesta auditoria.</div></div></div>`,
    ""
  ];
  let content = view==="auditoria" ? await viewAuditoria() : view==="usuarios" ? await viewUsuarios() : viewFluxo();
  document.getElementById("content").innerHTML = head + `<div class="view-head"><h2>${tt}</h2><p>${ts}</p></div>` + content + `<div class="footer-note">Fase 0 — Espinha · dados de demonstração · identidade <span>Prumo</span></div>`;
}

function showApp(){ document.getElementById("login").style.display="none"; document.getElementById("app").classList.add("show"); }
function showLogin(){ document.getElementById("login").style.display="flex"; document.getElementById("app").classList.remove("show"); }

async function boot(){
  try{
    const data = await api("/api/me");
    me = data.user; showApp(); render();
  }catch(e){ showLogin(); }
}

document.getElementById("btnEntrar").addEventListener("click", async ()=>{
  const email = document.getElementById("fEmail").value.trim();
  const password = document.getElementById("fSenha").value;
  const err = document.getElementById("loginError"); err.classList.remove("show");
  const btn = document.getElementById("btnEntrar"); btn.disabled = true; btn.textContent = "Entrando...";
  try{
    const data = await api("/api/auth/login", { method:"POST", body: JSON.stringify({ email, password }) });
    me = data.user; showApp(); render();
  }catch(e){ err.textContent = e.message; err.classList.add("show"); }
  finally{ btn.disabled=false; btn.textContent="Entrar"; }
});
document.querySelectorAll(".quick-btn").forEach(b=>b.addEventListener("click",()=>{document.getElementById("fEmail").value=b.dataset.email;document.getElementById("fSenha").value="Prumo@123";}));
document.getElementById("btnSair").addEventListener("click", async ()=>{ await api("/api/auth/logout",{method:"POST"}); me=null; showLogin(); });
document.getElementById("nav").addEventListener("click", e=>{ const b=e.target.closest(".nav-item"); if(!b||b.disabled) return; view=b.dataset.id; render(); });

boot();
</script>
</body>
</html>
