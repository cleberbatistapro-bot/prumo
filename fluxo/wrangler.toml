name = "prumo-fluxo"
compatibility_date = "2024-09-23"
pages_build_output_dir = "public"

# Banco próprio do Fluxo (isolamento de falhas — nenhuma irmã compartilha banco).
# O database_id abaixo é um placeholder para desenvolvimento local.
# Antes do primeiro deploy real, rode:
#   npx wrangler d1 create prumo-fluxo-db
# e substitua o database_id pelo id retornado.
[[d1_databases]]
binding = "DB"
database_name = "prumo-fluxo-db"
database_id = "d55348de-d3e9-48dd-9274-b742e4b624ce"

# Contrato com a plataforma-irmã Agenda — só a URL pública fica aqui.
# AGENDA_SHARED_KEY NÃO fica em [vars] (reescreveria o secret a cada deploy).
# Local: .dev.vars (gitignorado) com AGENDA_URL=http://localhost:8790 e AGENDA_SHARED_KEY=prumo-dev-shared-key
# Produção: `wrangler pages secret put AGENDA_SHARED_KEY --project-name=prumo-fluxo`
[vars]
AGENDA_URL = "https://prumo-agenda.pages.dev"
