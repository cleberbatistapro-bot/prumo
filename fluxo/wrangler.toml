name = "prumo-fluxo"
compatibility_date = "2024-09-23"
pages_build_output_dir = "public"

# Banco próprio do Fluxo (isolamento de falhas — nenhuma irmã compartilha banco).
# O database_id abaixo é um placeholder para desenvolvimento local.
# Antes do primeiro deploy real, rode:
#   npx wrangler d1 create prumo-fluxo-db
# e substitua o database_id pelo id retornado.
[[d1_databases]]
binding = "DB"
database_name = "prumo-fluxo-db"
database_id = "local-dev-placeholder"

# Contrato com a plataforma-irmã Agenda — só isso, nenhum acesso ao banco dela.
# Em produção, AGENDA_SHARED_KEY vira secret (`wrangler pages secret put`), nunca [vars].
[vars]
AGENDA_URL = "http://localhost:8790"
AGENDA_SHARED_KEY = "prumo-dev-shared-key"
