<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prumo — Agenda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Geist:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<script>(function(){try{var t=localStorage.getItem('prumo-theme');if(!t)t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<style>
  :root{
    --bg:#080c14; --surface:#0d1420; --surface-2:#111a28; --surface-3:#16202f;
    --border:#232f3f;
    --accent-rgb:56,199,232; --accent:#38C7E8; --accent-dim:rgba(var(--accent-rgb),.12); --accent-line:rgba(var(--accent-rgb),.32); --accent-glow:rgba(var(--accent-rgb),.14);
    --text:#EAF2F6; --muted:#8FA1AE; --muted-2:#5C6C79;
    --on-accent:#04222B; --card-shadow:0 30px 70px -28px rgba(0,0,0,.65),0 1px 0 rgba(255,255,255,.04) inset;
    --radius:14px; --mono:'Inter',sans-serif; --ui:'Geist','Inter',sans-serif; --display:'Plus Jakarta Sans','Inter',sans-serif;
    --glass-bg:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.015) 45%),rgba(255,255,255,.02);
    --glass-border:rgba(255,255,255,.08); --glass-blur:blur(18px) saturate(150%);
    --grid-line:rgba(255,255,255,.05); --noise-opacity:.035;
    --page-wash:radial-gradient(circle at 50% -10%,var(--accent-glow),transparent 36%),radial-gradient(circle at 88% 14%,rgba(var(--accent-rgb),.06),transparent 30%);
  }
  :root[data-theme="light"]{
    --bg:#EEF2F5; --surface:#FFFFFF; --surface-2:#F2F6F8; --surface-3:#E4EBEF;
    --border:#CBD5DC;
    --accent-rgb:14,148,180; --accent:#0E94B4; --accent-glow:rgba(var(--accent-rgb),.08);
    --text:#0F1B22; --muted:#4B5D66; --muted-2:#76868F;
    --on-accent:#FFFFFF; --card-shadow:0 20px 45px -22px rgba(15,23,32,.14),0 1px 2px rgba(15,23,32,.05);
    --glass-bg:linear-gradient(145deg,rgba(255,255,255,.75),rgba(255,255,255,.30) 45%),rgba(255,255,255,.50);
    --glass-border:rgba(15,23,32,.08); --glass-blur:blur(16px) saturate(160%);
    --grid-line:rgba(15,23,32,.05); --noise-opacity:.018;
    --page-wash:radial-gradient(circle at 50% -10%,var(--accent-glow),transparent 36%),radial-gradient(circle at 88% 14%,rgba(var(--accent-rgb),.05),transparent 30%);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--bg)}
  body{min-height:100vh;background:var(--page-wash),var(--bg);background-attachment:fixed;color:var(--text);font-family:var(--ui);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5;position:relative}
  body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:var(--noise-opacity);mix-blend-mode:overlay;
    background-image:url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 240 240%22%3E%3Cfilter id=%22n%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.85%22 numOctaves=%222%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23n)%22/%3E%3C/svg%3E');
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .wrap{max-width:720px;margin:0 auto;padding:24px}
  header{display:flex;align-items:center;gap:11px;margin-bottom:6px}
  .brand-mark{width:30px;height:30px;border-radius:9px;background:var(--glass-bg);border:1px solid var(--glass-border);display:grid;place-items:center;box-shadow:var(--card-shadow),0 0 0 1px var(--accent-line) inset}
  .brand-mark svg{width:15px;height:15px;stroke:var(--accent)}
  .brand-name{font-family:var(--display);font-weight:500;font-size:15px}
  .sister-tag{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--muted-2);border:1px solid var(--glass-border);padding:3px 9px;border-radius:20px}
  h1{font-family:var(--display);font-size:19px;font-weight:600;margin:20px 0 4px}
  .sub{font-size:12.5px;color:var(--muted);font-family:var(--mono);margin-bottom:20px}
  .person-group{margin-bottom:18px}
  .person-name{font-size:12.5px;font-weight:700;color:var(--accent);margin-bottom:8px;font-family:var(--mono)}
  .event{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;box-shadow:var(--card-shadow);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);display:flex;gap:12px;align-items:center;transition:transform .2s,border-color .2s}
  .event:hover{transform:translateY(-2px);border-color:var(--accent-line)}
  .event .e-time{font-family:var(--mono);font-size:11.5px;color:var(--accent);min-width:88px}
  .event .e-title{font-size:13.5px;font-weight:600}
  .event .e-loc{font-size:11.5px;color:var(--muted-2);margin-top:2px}
  .empty{color:var(--muted-2);font-family:var(--mono);font-size:12px;text-align:center;padding:30px 0}
  footer{text-align:center;color:var(--muted-2);font-size:11px;padding:30px 0 10px;font-family:var(--mono)}
  footer span{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></div>
    <div class="brand-name">Prumo · Agenda</div>
    <span class="sister-tag">plataforma-irmã</span>
  </header>
  <h1>Próximos eventos</h1>
  <div class="sub">banco e deploy próprios — dados de demonstração</div>
  <div id="list"></div>
  <footer>Agenda · dados de demonstração · identidade <span>Prumo</span></footer>
</div>
<script>
async function boot(){
  const list = document.getElementById("list");
  try{
    const res = await fetch("/api/events?person=all-demo", { headers: { "X-Prumo-Key": "prumo-dev-shared-key" } });
    // endpoint exige pessoa específica em produção; aqui a demo local lista os 3 e-mails conhecidos.
    const people = [
      { email: "gerente@prumo.demo", name: "Você (Gerente)" },
      { email: "carla@prumo.demo", name: "Carla Dias" },
      { email: "ana@prumo.demo", name: "Ana Ribeiro" },
    ];
    let html = "";
    for(const p of people){
      const r = await fetch(`/api/events?person=${encodeURIComponent(p.email)}`, { headers: { "X-Prumo-Key": "prumo-dev-shared-key" } });
      const data = await r.json();
      const evs = data.events || [];
      if(!evs.length) continue;
      html += `<div class="person-group"><div class="person-name">${p.name}</div>`;
      evs.forEach(e=>{
        const d = new Date(e.start_at);
        const time = d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}) + " · " + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
        html += `<div class="event"><span class="e-time">${time}</span><div><div class="e-title">${e.title}</div><div class="e-loc">${e.location||''}</div></div></div>`;
      });
      html += `</div>`;
    }
    list.innerHTML = html || `<div class="empty">Nenhum evento futuro nos dados de demonstração.</div>`;
  }catch(e){
    list.innerHTML = `<div class="empty">Não foi possível carregar a agenda agora.</div>`;
  }
}
boot();
</script>
</body>
</html>
