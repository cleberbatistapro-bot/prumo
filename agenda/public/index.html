<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prumo — Agenda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>(function(){try{var t=localStorage.getItem('prumo-theme');if(!t)t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<style>
  :root{
    --bg:#0D1117; --surface:#161B22; --surface-2:#1C2128; --surface-3:#21262D;
    --border:#30363D;
    --teal-rgb:0,231,209; --teal:#00E7D1; --teal-dim:rgba(var(--teal-rgb),.12); --teal-line:rgba(var(--teal-rgb),.35);
    --text:#E6EDF3; --muted:#8B949E; --muted-2:#6E7681;
    --on-teal:#04211E; --card-shadow:none;
    --radius:12px; --mono:'Inter',sans-serif; --ui:'Inter',sans-serif;
  }
  :root[data-theme="light"]{
    --bg:#E4E9ED; --surface:#FFFFFF; --surface-2:#EDF1F4; --surface-3:#DEE4E9;
    --border:#CBD3DA;
    --teal-rgb:0,120,107; --teal:#00786B;
    --text:#12181D; --muted:#4E5A64; --muted-2:#79838D;
    --on-teal:#FFFFFF; --card-shadow:0 1px 3px rgba(15,23,32,.08),0 1px 2px rgba(15,23,32,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--ui);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .wrap{max-width:720px;margin:0 auto;padding:24px}
  header{display:flex;align-items:center;gap:11px;margin-bottom:6px}
  .brand-mark{width:30px;height:30px;border-radius:8px;background:var(--teal-dim);border:1px solid var(--teal-line);display:grid;place-items:center}
  .brand-mark svg{width:15px;height:15px;stroke:var(--teal)}
  .brand-name{font-weight:800;font-size:15px}
  .sister-tag{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--muted-2);border:1px solid var(--border);padding:3px 9px;border-radius:20px}
  h1{font-size:19px;font-weight:800;margin:20px 0 4px}
  .sub{font-size:12.5px;color:var(--muted);font-family:var(--mono);margin-bottom:20px}
  .person-group{margin-bottom:18px}
  .person-name{font-size:12.5px;font-weight:700;color:var(--teal);margin-bottom:8px;font-family:var(--mono)}
  .event{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;box-shadow:var(--card-shadow);display:flex;gap:12px;align-items:center}
  .event .e-time{font-family:var(--mono);font-size:11.5px;color:var(--teal);min-width:88px}
  .event .e-title{font-size:13.5px;font-weight:600}
  .event .e-loc{font-size:11.5px;color:var(--muted-2);margin-top:2px}
  .empty{color:var(--muted-2);font-family:var(--mono);font-size:12px;text-align:center;padding:30px 0}
  footer{text-align:center;color:var(--muted-2);font-size:11px;padding:30px 0 10px;font-family:var(--mono)}
  footer span{color:var(--teal)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></div>
    <div class="brand-name">Prumo · Agenda</div>
    <span class="sister-tag">plataforma-irmã</span>
  </header>
  <h1>Próximos eventos</h1>
  <div class="sub">banco e deploy próprios — dados de demonstração</div>
  <div id="list"></div>
  <footer>Agenda · dados de demonstração · identidade <span>Prumo</span></footer>
</div>
<script>
async function boot(){
  const list = document.getElementById("list");
  try{
    const res = await fetch("/api/events?person=all-demo", { headers: { "X-Prumo-Key": "prumo-dev-shared-key" } });
    // endpoint exige pessoa específica em produção; aqui a demo local lista os 3 e-mails conhecidos.
    const people = [
      { email: "gerente@prumo.demo", name: "Você (Gerente)" },
      { email: "carla@prumo.demo", name: "Carla Dias" },
      { email: "ana@prumo.demo", name: "Ana Ribeiro" },
    ];
    let html = "";
    for(const p of people){
      const r = await fetch(`/api/events?person=${encodeURIComponent(p.email)}`, { headers: { "X-Prumo-Key": "prumo-dev-shared-key" } });
      const data = await r.json();
      const evs = data.events || [];
      if(!evs.length) continue;
      html += `<div class="person-group"><div class="person-name">${p.name}</div>`;
      evs.forEach(e=>{
        const d = new Date(e.start_at);
        const time = d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}) + " · " + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
        html += `<div class="event"><span class="e-time">${time}</span><div><div class="e-title">${e.title}</div><div class="e-loc">${e.location||''}</div></div></div>`;
      });
      html += `</div>`;
    }
    list.innerHTML = html || `<div class="empty">Nenhum evento futuro nos dados de demonstração.</div>`;
  }catch(e){
    list.innerHTML = `<div class="empty">Não foi possível carregar a agenda agora.</div>`;
  }
}
boot();
</script>
</body>
</html>
