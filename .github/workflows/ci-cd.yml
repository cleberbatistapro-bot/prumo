name: CI/CD — Prumo

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  fluxo:
    name: Fluxo — testes e deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fluxo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fluxo/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes
        run: npm test

      # Deploy só acontece em push direto na master (nunca em pull request) —
      # e só depois que os testes acima passaram. Se um teste quebra, para aqui.
      - name: Deploy no Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy public --project-name=prumo-fluxo --branch=master

  agenda:
    name: Agenda — deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agenda
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agenda/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Deploy no Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy public --project-name=prumo-agenda --branch=master
